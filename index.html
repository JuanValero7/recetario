<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recetario</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7d5b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#f2f4f6; --card:#fff; --ink:#141a20; --muted:#525c66; --line:#dde2e7;
    --accent:#20724f; --accent-ink:#fff; --chip:#e7ecea; --warn:#9c4708; --danger:#a51f16;
    --okbg:rgba(32,114,79,.12);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#101317; --card:#1b1f25; --ink:#eef1f5; --muted:#a7b2bd;
      --line:#2c333c; --accent:#4bbd88; --chip:#242b31; --warn:#eda24a; --danger:#f0776a;
      --okbg:rgba(75,189,136,.16);}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;max-width:100vw;
    font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:var(--bg);
    padding:14px 16px 10px;max-width:640px;margin:0 auto;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:26px;letter-spacing:-.2px;font-weight:800}
  .sub{color:var(--muted);font-size:14px;margin-top:2px;font-weight:500}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
    background:var(--card);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;border:0;background:transparent;color:var(--muted);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
    font-size:11px;font-weight:700;border-radius:14px}
  nav button .ic{font-size:25px;line-height:1;filter:grayscale(.4);opacity:.75}
  nav button.on{color:var(--accent)}
  nav button.on .ic{filter:none;opacity:1}
  main{max-width:640px;margin:0 auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;
    padding:13px 18px;font-size:15px;font-weight:600;cursor:pointer;min-height:46px}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn.sm{padding:9px 13px;font-size:14px;min-height:40px}
  .btn:active{transform:translateY(1px)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
  h3{margin:2px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .meal{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .meal:last-child{border-bottom:0}
  .meal.done .name{text-decoration:line-through;color:var(--muted)}
  .meal.ok{background:linear-gradient(90deg,rgba(47,125,91,.10),transparent);border-radius:10px;padding-left:10px;margin-left:-10px}
  .meal.ok .name{color:var(--accent)}
  .name{font-weight:600;font-size:16px}
  .code{font:12px ui-monospace,monospace;color:var(--muted);margin-right:8px}
  .mini{background:var(--chip);border:0;border-radius:10px;padding:10px 13px;font-size:14px;cursor:pointer;color:var(--ink);min-height:40px}
  .mini.undo{color:var(--warn)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle;word-break:break-word}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{background:var(--chip);color:var(--muted);border-radius:20px;padding:3px 10px;font-size:12px}
  .buy{color:var(--warn);font-weight:700}
  .cost{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
  input,select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    padding:11px 12px;font-size:16px;font-family:inherit;min-height:44px}
  input[type=number]{width:92px}
  input[type=checkbox]{min-height:auto;width:20px;height:20px}
  .search{width:100%;margin-bottom:10px;padding:12px 14px}
  .empty{color:var(--muted);text-align:center;padding:26px}
  details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card);overflow:hidden}
  details>summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;
    justify-content:space-between;align-items:center}
  details>summary::-webkit-details-marker{display:none}
  details>summary::after{content:"▸";color:var(--muted);font-size:12px}
  details[open]>summary::after{content:"▾"}
  details .inner{padding:0 14px 8px;overflow-x:auto}
  .nb{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .kcal{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
  .pill{font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
  .pill.alta{color:var(--danger);border-color:var(--danger)}
  .pill.media{color:var(--warn);border-color:var(--warn)}
  .pill.lact{color:var(--accent);border-color:var(--accent)}
  .pill.aler{color:var(--muted)}
  .pill.ok{color:var(--accent);border-color:var(--accent);background:rgba(47,125,91,.10);font-weight:600}
  .flash{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);
    color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
  .flash.show{opacity:.95}
  .link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:0;text-align:left}
  .del{color:var(--danger);cursor:pointer;background:none;border:0;font-size:13px}
  .bomrow{display:grid;grid-template-columns:1fr 84px 96px 30px;gap:6px;margin-bottom:6px;align-items:center}
  .bomrow input{width:100%}
  @media(max-width:520px){.bomrow{grid-template-columns:1fr 70px 78px 28px}}
  /* ---- menú compacto ---- */
  .mealc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--card);border:0;border-bottom:1px solid var(--line);
    padding:14px 4px;cursor:pointer;color:var(--ink)}
  .mealc:last-of-type{border-bottom:0}
  .mealc.ok{background:var(--okbg);border-radius:12px;border-bottom:0;margin:3px 0;padding:14px 12px}
  .mealc.done .mname{text-decoration:line-through;color:var(--muted)}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--line);flex-shrink:0}
  .dot.g{background:var(--accent);box-shadow:0 0 0 3px var(--okbg)}
  .mname{flex:1;min-width:0;font-size:18px;font-weight:600;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mic{display:flex;gap:3px;font-size:15px;flex-shrink:0}
  .chev{color:var(--muted);font-size:20px;flex-shrink:0;transition:transform .15s}
  .open .chev{transform:rotate(90deg)}
  /* fila de compra: nombre (abre detalle) + botón Comprado siempre visible al lado */
  .buyrow{display:flex;align-items:stretch;gap:8px;border-bottom:1px solid var(--line)}
  .buyrow:last-of-type{border-bottom:0}
  .buyrow .mealc{flex:1;min-width:0;width:auto;border-bottom:0;padding-right:6px}
  .buybtn{flex-shrink:0;align-self:center;min-height:46px;padding:0 16px;font-size:20px;border-radius:11px}
  .detail{padding:4px 4px 16px;border-bottom:1px solid var(--line);animation:fade .15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .drow{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .stat{display:flex;flex-direction:column}
  .stat b{font-size:20px;font-weight:800}
  .stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .alert{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:15px}
  .actions{display:flex;gap:8px;margin-top:6px}
  .actions .btn{flex:1;justify-content:center;display:flex;align-items:center;gap:6px}
  /* ---- menú Más ---- */
  .bigrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;
    border:0;border-bottom:1px solid var(--line);padding:18px 4px;font-size:17px;font-weight:600;
    color:var(--ink);cursor:pointer}
  .bigrow:last-child{border-bottom:0}
  .bigrow .ic{font-size:26px}
  .bigrow .chev{margin-left:auto}
</style>
</head>
<body>
<header>
  <h1 id="title">Recetario</h1>
  <div class="sub" id="sub">Cargando…</div>
</header>
<main id="view"></main>
<nav>
  <button data-tab="menu" class="on"><span class="ic">🍽️</span>Menú</button>
  <button data-tab="compra"><span class="ic">🛒</span>Compra</button>
  <button data-tab="inventario"><span class="ic">📦</span>Inventario</button>
  <button data-tab="mas"><span class="ic">☰</span>Más</button>
</nav>
<div class="flash" id="flash"></div>
<datalist id="dl-ings"></datalist>

<script>
const $ = s => document.querySelector(s);
const view = $("#view");
let tab = "menu";
let CATS = [];         // lista de categorías
let INGS = [];         // maestro de ingredientes (para autocompletar/dropdowns)

// ================== CAPA DE DATOS LOCAL (offline, en el móvil) ==================
const STORE_KEY="recetario_db_v1";
let DB=null;
const CAT_ORDER=["Verduras y hortalizas","Frutas","Carnes","Pescados y mariscos","Lácteos y huevos",
  "Panadería","Despensa","Salsas y condimentos","Especias","Bebidas","Congelados","Otros"];
const HIST_ORD={baja:0,media:1,alta:2}, HIST_INV=["baja","media","alta"];
const N_DES=5, N_ALM=10;

async function initDB(){
  const saved=localStorage.getItem(STORE_KEY);
  if(saved){ DB=JSON.parse(saved); }
  else { DB=await fetch("seed.json").then(r=>r.json()); if(!DB.seq)DB.seq={bom:0,historial:0,menu:0}; saveDB(); }
  if(!DB.cubiertos) DB.cubiertos=[];   // ingredientes marcados "no compro / tengo sustituto"
  if(navigator.storage&&navigator.storage.persist){ try{ await navigator.storage.persist(); }catch(e){} }
}
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
const cubiertosSet=()=>new Set(DB.cubiertos||[]);
function nextId(t){ DB.seq[t]=(DB.seq[t]||0)+1; return DB.seq[t]; }
const recetaByCodigo=c=>DB.recetas.find(r=>r.codigo===c);
const ingByName=n=>DB.ingredientes.find(i=>i.nombre===n);
const bomOf=cod=>DB.bom.filter(b=>b.receta_codigo===cod);
const invMap=()=>{ const m={}; DB.inventario.forEach(r=>m[r.ingrediente]=r.cantidad); return m; };
const maxMenuSem=()=>DB.menu.length?Math.max(...DB.menu.map(m=>m.semana)):null;
function semanaActual(){ const s=maxMenuSem(); if(s!=null)return s;
  const h=DB.historial.map(x=>x.semana).filter(x=>x!=null); return h.length?Math.max(...h):1; }
function proximaSemana(){ const a=[...DB.menu.map(m=>m.semana),...DB.historial.map(h=>h.semana)].filter(x=>x!=null);
  return a.length?Math.max(...a)+1:1; }
function ultimoUso(){ const m={}; DB.historial.forEach(h=>{ if(h.codigo!=null) m[h.codigo]=Math.max(m[h.codigo]??-1e9,h.semana??0); }); return m; }
function pickWeighted(pool,pesos){ let t=pesos.reduce((a,b)=>a+b,0), x=Math.random()*t, i=0;
  for(;i<pesos.length;i++){ x-=pesos[i]; if(x<=0)break; } return Math.min(i,pool.length-1); }
function elegir(tipo,n,sem,excluir){
  const ex=new Set(excluir||[]), ult=ultimoUso(), pool=[], pesos=[];
  DB.recetas.filter(r=>r.tipo===tipo).forEach(r=>{ if(ex.has(r.codigo))return;
    const u=ult[r.codigo], rec=(u!=null)?(sem-u):(sem+2); pool.push(r.codigo); pesos.push(Math.max(1,rec)); });
  const out=[], k=Math.min(n,pool.length);
  for(let j=0;j<k;j++){ const i=pickWeighted(pool,pesos); out.push(pool[i]); pool.splice(i,1); pesos.splice(i,1); }
  return out;
}
function generarMenu(resortear){
  let sem; const mx=maxMenuSem();
  if(resortear&&mx!=null){ sem=semanaActual(); DB.menu=DB.menu.filter(m=>m.semana!==sem); } else sem=proximaSemana();
  [["Desayuno",N_DES],["Almuerzo/Cena",N_ALM]].forEach(([tipo,n])=>
    elegir(tipo,n,sem,[]).forEach(cod=>DB.menu.push({id:nextId('menu'),semana:sem,codigo:cod,tipo,consumida:0})));
  saveDB();
}
const costeReceta=(cod,inv)=>bomOf(cod).reduce((s,b)=>s+Math.max(0,(b.cantidad||0)-(inv[b.ingrediente]||0)),0);
const consumirVirtual=(cod,inv)=>bomOf(cod).forEach(b=>inv[b.ingrediente]=Math.max(0,(inv[b.ingrediente]||0)-(b.cantidad||0)));
function generarMenuInventario(){
  const sem=proximaSemana(); DB.menu=DB.menu.filter(m=>m.semana!==sem); const inv=invMap();
  [["Desayuno",N_DES],["Almuerzo/Cena",N_ALM]].forEach(([tipo,n])=>{
    let cand=DB.recetas.filter(r=>r.tipo===tipo).map(r=>r.codigo); const k=Math.min(n,cand.length);
    for(let j=0;j<k;j++){ cand.sort((a,b)=>(costeReceta(a,inv)-costeReceta(b,inv))||(Math.random()-0.5));
      const el=cand.shift(); consumirVirtual(el,inv); DB.menu.push({id:nextId('menu'),semana:sem,codigo:el,tipo,consumida:0}); }
  });
  saveDB();
}
function cambiarPlatoLocal(codigo){
  const sem=semanaActual(), row=DB.menu.find(m=>m.codigo===codigo&&m.semana===sem); if(!row)return null;
  const actuales=DB.menu.filter(m=>m.semana===sem).map(m=>m.codigo);
  const nv=elegir(row.tipo,1,sem,actuales); if(!nv.length)return null;
  row.codigo=nv[0]; row.consumida=0; saveDB(); return nv[0];
}
function nutriReceta(cod){
  let kcal=0,hist=0,lact=0; const al=new Set();
  bomOf(cod).forEach(b=>{ const i=ingByName(b.ingrediente); if(!i)return;
    kcal+=(i.kcal||0)*(b.cantidad||0); hist=Math.max(hist,HIST_ORD[i.histamina]||0); lact=lact||(i.lactosa||0);
    if(i.alergenos)i.alergenos.split(",").filter(Boolean).forEach(a=>al.add(a)); });
  return {kcal:Math.round(kcal),histamina:HIST_INV[hist],lactosa:lact?1:0,alergenos:[...al].sort()};
}
function dispCoste(cod, inv, cub){
  inv=inv||invMap(); cub=cub||cubiertosSet(); let disponible=true, coste=0, tienePrecio=false;
  bomOf(cod).forEach(b=>{ const i=ingByName(b.ingrediente)||{};
    if((inv[b.ingrediente]||0) < (b.cantidad||0) && !cub.has(b.ingrediente)) disponible=false;
    if(i.precio!=null){ coste+=i.precio*(b.cantidad||0); tienePrecio=true; } });
  return {disponible, coste: tienePrecio?Math.round(coste*100)/100:null};
}
function menuActual(){
  const sem=maxMenuSem(), inv=invMap(), cub=cubiertosSet();
  const items=sem==null?[]:DB.menu.filter(m=>m.semana===sem)
    .sort((a,b)=>(a.tipo<b.tipo?1:a.tipo>b.tipo?-1:0)||a.id-b.id)
    .map(m=>{ const r=recetaByCodigo(m.codigo)||{}, dc=dispCoste(m.codigo,inv,cub);
      return {codigo:m.codigo,tipo:m.tipo,consumida:m.consumida,nombre:r.nombre,nutri:nutriReceta(m.codigo),disponible:dc.disponible,coste:dc.coste}; });
  return {semana:sem,items};
}
function listaCompra(){
  const sem=maxMenuSem(), nec={}, recs={};
  DB.menu.filter(m=>m.semana===sem).forEach(m=>bomOf(m.codigo).forEach(b=>{
    const e=nec[b.ingrediente]||(nec[b.ingrediente]={qty:0,unidad:b.unidad,cat:b.categoria}); e.qty+=b.cantidad||0;
    const r=recetaByCodigo(m.codigo)||{}; (recs[b.ingrediente]||(recs[b.ingrediente]=[])).push({codigo:m.codigo,nombre:r.nombre,cantidad:b.cantidad}); }));
  const inv=invMap(), cub=cubiertosSet(), out=[];
  for(const ing in nec){ const e=nec[ing], m=ingByName(ing), tengo=inv[ing]||0, falta=(e.qty||0)-tengo, esCub=cub.has(ing);
    out.push({ingrediente:ing,necesita:Math.round(e.qty*100)/100,tengo:Math.round(tengo*100)/100,
      por_comprar:esCub?0:(falta>0?Math.ceil(falta):0),cubierto:esCub,
      unidad:(m&&m.unidad)||e.unidad,categoria:(m&&m.categoria)||"Otros",
      mercados:(m&&m.mercados)||"",precio:(m&&m.precio)??null,
      recetas:(recs[ing]||[]).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")),
      lactosa:(m&&m.lactosa)||0,histamina:(m&&m.histamina)||"baja",alergenos:(m&&m.alergenos)||""}); }
  out.sort((a,b)=>(b.por_comprar-a.por_comprar)||a.ingrediente.toLowerCase().localeCompare(b.ingrediente.toLowerCase()));
  return out;
}
function setInv(ing,c){ const r=DB.inventario.find(x=>x.ingrediente===ing); if(r)r.cantidad=c; else DB.inventario.push({ingrediente:ing,cantidad:c}); }
function addInv(ing,c){ const r=DB.inventario.find(x=>x.ingrediente===ing); if(r)r.cantidad=(r.cantidad||0)+c; else DB.inventario.push({ingrediente:ing,cantidad:c}); }
function consumir(codigo){
  const sem=semanaActual(), m=DB.menu.find(x=>x.codigo===codigo&&x.semana===sem);
  if(m&&m.consumida)return; if(m)m.consumida=1;
  DB.historial.push({id:nextId('historial'),semana:sem,codigo:codigo,consumida:1,puntuacion:0});
  bomOf(codigo).forEach(b=>{ const r=DB.inventario.find(x=>x.ingrediente===b.ingrediente); if(r)r.cantidad=Math.max(0,(r.cantidad||0)-(b.cantidad||0)); });
  saveDB();
}
function desconsumir(codigo){
  const sem=semanaActual(), m=DB.menu.find(x=>x.codigo===codigo&&x.semana===sem); if(m)m.consumida=0;
  let idx=-1,mid=-1; DB.historial.forEach((h,i)=>{ if(h.codigo===codigo&&h.semana===sem&&h.id>mid){mid=h.id;idx=i;} });
  if(idx>=0)DB.historial.splice(idx,1);
  bomOf(codigo).forEach(b=>addInv(b.ingrediente,b.cantidad||0)); saveDB();
}
const categoriasList=()=>{ const en=new Set(DB.ingredientes.map(i=>i.categoria).filter(Boolean));
  return [...CAT_ORDER.filter(c=>en.has(c)),...[...en].filter(c=>!CAT_ORDER.includes(c)).sort()]; };
const ingredientesList=()=>DB.ingredientes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre))
  .map(i=>({nombre:i.nombre,unidad:i.unidad,precio:i.precio,mercados:i.mercados,categoria:i.categoria||"Otros",kcal:i.kcal,lactosa:i.lactosa,histamina:i.histamina,alergenos:i.alergenos}));
const inventarioList=()=>DB.inventario.slice().sort((a,b)=>a.ingrediente.localeCompare(b.ingrediente))
  .map(r=>{ const m=ingByName(r.ingrediente)||{}; return {ingrediente:r.ingrediente,cantidad:r.cantidad,unidad:m.unidad,categoria:m.categoria||"Otros",kcal:m.kcal,lactosa:m.lactosa,histamina:m.histamina,alergenos:m.alergenos}; });
const historialList=()=>DB.historial.slice().sort((a,b)=>(b.semana-a.semana)||(b.id-a.id)).slice(0,200)
  .map(h=>{ const r=recetaByCodigo(h.codigo)||{}; return {semana:h.semana,codigo:h.codigo,nombre:r.nombre,puntuacion:h.puntuacion}; });
function recetaDetalle(cod){ const r=recetaByCodigo(cod); if(!r)return null;
  return {receta:{...r},ingredientes:bomOf(cod).slice().sort((a,b)=>a.ingrediente.localeCompare(b.ingrediente))
    .map(b=>({id:b.id,ingrediente:b.ingrediente,cantidad:b.cantidad,unidad:b.unidad,categoria:b.categoria})),nutri:nutriReceta(cod),...dispCoste(cod)}; }
function guardarReceta(d){
  let cod=(d.codigo||"").trim(); const tipo=d.tipo||"Almuerzo/Cena";
  if(!cod){ const p=tipo==="Desayuno"?"D":"A";
    const nums=DB.recetas.filter(r=>r.codigo.startsWith(p)).map(r=>parseInt(r.codigo.slice(1))).filter(x=>!isNaN(x));
    cod=p+((nums.length?Math.max(...nums):0)+1); }
  const r=recetaByCodigo(cod);
  if(r){ r.nombre=(d.nombre||"").trim(); r.tipo=tipo; } else DB.recetas.push({codigo:cod,nombre:(d.nombre||"").trim(),tipo});
  saveDB(); return cod;
}
function borrarReceta(cod){ DB.bom=DB.bom.filter(b=>b.receta_codigo!==cod); DB.menu=DB.menu.filter(m=>m.codigo!==cod); DB.recetas=DB.recetas.filter(r=>r.codigo!==cod); saveDB(); }
function guardarBom(cod,items){ DB.bom=DB.bom.filter(b=>b.receta_codigo!==cod);
  (items||[]).forEach(it=>{ const ing=(it.ingrediente||"").trim(); if(!ing)return;
    DB.bom.push({id:nextId('bom'),receta_codigo:cod,ingrediente:ing,cantidad:parseFloat(it.cantidad)||0,unidad:it.unidad||"",categoria:it.categoria||""}); }); saveDB(); }
function guardarIngrediente(d){
  const nombre=(d.nombre||"").trim(); const i=ingByName(nombre);
  const kcal=(d.kcal!==""&&d.kcal!=null)?parseFloat(d.kcal):null;
  const lact=[1,true,"1","true","on"].includes(d.lactosa)?1:0;
  const v={unidad:d.unidad||"",precio:d.precio??null,mercados:d.mercados||"",categoria:d.categoria||"Otros",kcal,lactosa:lact,histamina:d.histamina||"baja",alergenos:d.alergenos||""};
  if(i)Object.assign(i,v); else DB.ingredientes.push({nombre,...v});
  if(!DB.inventario.find(x=>x.ingrediente===nombre))DB.inventario.push({ingrediente:nombre,cantidad:0}); saveDB();
}
function borrarIngrediente(nombre){ DB.ingredientes=DB.ingredientes.filter(i=>i.nombre!==nombre); DB.inventario=DB.inventario.filter(x=>x.ingrediente!==nombre); saveDB(); }

function localApi(path,method,body){
  body=body||{}; const [p,queryStr]=path.split("?"); const qs=new URLSearchParams(queryStr||"");
  switch(p){
    case "/estado": return {semana:semanaActual(),menu:menuActual(),n_compra:listaCompra().filter(x=>x.por_comprar>0).length};
    case "/compra": return listaCompra();
    case "/inventario": if(method==="POST"){ setInv(body.ingrediente,parseFloat(body.cantidad)||0); saveDB(); return {ok:true}; } return inventarioList();
    case "/comprado": addInv(body.ingrediente,parseFloat(body.cantidad)||0);
      DB.cubiertos=(DB.cubiertos||[]).filter(x=>x!==body.ingrediente); saveDB(); return {ok:true};
    case "/cubrir": { const s=new Set(DB.cubiertos||[]); s.add(body.ingrediente); DB.cubiertos=[...s]; saveDB(); return {ok:true}; }
    case "/descubrir": DB.cubiertos=(DB.cubiertos||[]).filter(x=>x!==body.ingrediente); saveDB(); return {ok:true};
    case "/historial": return historialList();
    case "/recetas": return DB.recetas.slice().sort((a,b)=>(a.tipo<b.tipo?1:a.tipo>b.tipo?-1:0)||a.codigo.localeCompare(b.codigo));
    case "/receta": return recetaDetalle(qs.get("codigo"))||{error:"no encontrada"};
    case "/ingredientes": return ingredientesList();
    case "/categorias": return categoriasList();
    case "/generar": if(body.modo==="inventario")generarMenuInventario(); else generarMenu(!!body.resortear); return menuActual();
    case "/cambiar_plato": { const n=cambiarPlatoLocal(body.codigo); return {ok:n!=null,codigo:n}; }
    case "/consumir": consumir(body.codigo); return {ok:true};
    case "/desconsumir": desconsumir(body.codigo); return {ok:true};
    case "/receta/guardar": return {ok:true,codigo:guardarReceta(body)};
    case "/receta/borrar": borrarReceta(body.codigo); return {ok:true};
    case "/bom/guardar": guardarBom(body.codigo,body.items); return {ok:true};
    case "/ingrediente/guardar": guardarIngrediente(body); return {ok:true};
    case "/ingrediente/borrar": borrarIngrediente(body.nombre); return {ok:true};
    default: return {error:"no encontrado"};
  }
}
async function api(p){ return localApi(p,"GET"); }
function post(p,b){ return Promise.resolve(localApi(p,"POST",b)); }

function renderDatos(){
  view.innerHTML=`
    <div class="card"><strong>Copia de seguridad</strong>
      <div class="sub">Tus datos viven SOLO en este dispositivo. Exporta de vez en cuando por seguridad.
      «Importar» acepta un backup completo o un archivo solo de precios (facturas).</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn" onclick="exportarDatos()">⬇️ Exportar</button>
        <label class="btn ghost" style="cursor:pointer">⬆️ Importar<input type="file" accept="application/json" onchange="importarDatos(event)" style="display:none"></label>
      </div></div>
    <div class="card"><strong>Estado</strong>
      <div class="sub">${DB.recetas.length} recetas · ${DB.ingredientes.length} ingredientes · ${DB.menu.length} filas de menú · ${DB.historial.length} en historial</div></div>`;
}
function exportarDatos(){ const b=new Blob([JSON.stringify(DB)],{type:"application/json"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="recetario-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click(); flash("Backup descargado"); }
function importarDatos(ev){ const f=ev.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{
      const d=JSON.parse(rd.result);
      if(d.precios && !d.recetas){                 // archivo SOLO de precios -> merge
        let n=0, faltan=[];
        for(const nombre in d.precios){ const i=ingByName(nombre);
          if(i){ i.precio=parseFloat(d.precios[nombre]); n++; } else faltan.push(nombre); }
        saveDB(); render();
        flash(`${n} precios actualizados`+(faltan.length?` · ${faltan.length} sin match`:""));
        if(faltan.length) console.log("Sin match:",faltan);
        return;
      }
      if(!d.recetas||!d.ingredientes)throw 0;       // backup completo -> reemplaza
      DB=d; if(!DB.seq)DB.seq={bom:0,historial:0,menu:0}; if(!DB.cubiertos)DB.cubiertos=[];
      saveDB(); flash("Datos importados"); loadRefs().then(render);
    }catch(e){ flash("Archivo inválido"); } }; rd.readAsText(f); }
function flash(m){const f=$("#flash");f.textContent=m;f.classList.add("show");setTimeout(()=>f.classList.remove("show"),1600);}
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nutriBadges(n){
  if(!n) return "";
  let a = n.alergenos;
  if(typeof a === "string") a = a.split(",").filter(Boolean);
  let h="";
  if(n.histamina==="alta")  h+='<span class="pill alta">histamina alta</span>';
  else if(n.histamina==="media") h+='<span class="pill media">histamina media</span>';
  if(Number(n.lactosa))     h+='<span class="pill lact">lactosa</span>';
  (a||[]).forEach(x=>h+=`<span class="pill aler">${esc(x)}</span>`);
  return h;
}
function nutriIcons(n){
  if(!n) return "";
  let a=n.alergenos; if(typeof a==="string") a=a.split(",").filter(Boolean);
  let h="";
  if(n.histamina==="alta") h+="🔴"; else if(n.histamina==="media") h+="🟠";
  if(Number(n.lactosa)) h+="🥛";
  if((a||[]).length) h+="⚠️";
  return h;
}
function nutriDetail(n){
  if(!n) return "";
  let a=n.alergenos; if(typeof a==="string") a=a.split(",").filter(Boolean);
  let h="";
  if(n.histamina==="alta") h+='<div class="alert">🔴 <span>Histamina <b>alta</b></span></div>';
  else if(n.histamina==="media") h+='<div class="alert">🟠 <span>Liberador de histamina (media)</span></div>';
  if(Number(n.lactosa)) h+='<div class="alert">🥛 <span>Contiene lactosa</span></div>';
  if((a||[]).length) h+='<div class="alert">⚠️ <span>Alérgenos: '+a.map(esc).join(", ")+'</span></div>';
  return h || '<div class="alert" style="color:var(--muted)">Sin alertas destacadas</div>';
}

      <div class="row" style="margin-bottom:6px">
        <strong>${nueva?"Nueva receta":"Editar "+r.codigo}</strong>
        <button class="link" onclick="listaRecetas()">← volver</button>
      </div>
      ${d.nutri?`<div class="nb" style="margin-bottom:10px"><span class="kcal">${d.nutri.kcal} kcal</span>${nutriBadges(d.nutri)}</div>`:''}
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <input id="rn" placeholder="Nombre de la receta" value="${esc(r.nombre)}" style="flex:1;min-width:200px">
        <select id="rt">
          <option ${r.tipo==='Desayuno'?'selected':''}>Desayuno</option>
          <option ${r.tipo!=='Desayuno'?'selected':''}>Almuerzo/Cena</option>
        </select>
      </div>
      <h3>Ingredientes</h3>
      <div id="bom">${bom.map(bomRow).join("")}</div>
      <button class="mini" onclick="addBom()">+ ingrediente</button>
      <div class="row" style="margin-top:14px">
        ${nueva?'':`<button class="del" onclick="borraReceta('${r.codigo}')">🗑 borrar receta</button>`}
        <button class="btn" onclick="guardaReceta('${r.codigo}')">Guardar</button>
      </div>
    </div>`;
}
function bomRow(b){ return `<div class="bomrow">
  <input list="dl-ings" placeholder="ingrediente" value="${esc(b.ingrediente)}">
  <input type="number" step="0.1" placeholder="cant." value="${b.cantidad??1}">
  <input placeholder="unidad" value="${esc(b.unidad||'')}">
  <button class="del" onclick="this.parentElement.remove()">✕</button></div>`; }
function addBom(){ $("#bom").insertAdjacentHTML("beforeend", bomRow({ingrediente:"",cantidad:1,unidad:""})); }
async function guardaReceta(cod){
  const nombre=$("#rn").value.trim(), tipo=$("#rt").value;
  if(!nombre){ flash("Ponle nombre"); return; }
  const res=await post("/receta/guardar",{codigo:cod,nombre,tipo});
  const codigo=res.codigo;
  const items=[...document.querySelectorAll("#bom .bomrow")].map(row=>{
    const [i,c,u]=row.querySelectorAll("input");
    return {ingrediente:i.value.trim(),cantidad:c.value,unidad:u.value.trim()};
  }).filter(x=>x.ingrediente);
  await post("/bom/guardar",{codigo,items});
  flash("Receta guardada ("+codigo+")"); listaRecetas();
}
async function borraReceta(cod){ if(confirm("¿Borrar la receta "+cod+"? (el historial se conserva)")){ await post("/receta/borrar",{codigo:cod}); flash("Receta borrada"); listaRecetas(); } }

// --- Ingredientes
async function listaIngredientes(){
  $("#adminbody").innerHTML = `<input class="search" id="qi" placeholder="Buscar ingrediente…" oninput="filtraIng()">
    <div id="inglist"></div>`;
  filtraIng();
}
const HISTS=["baja","media","alta"];
function filtraIng(){
  const q=($("#qi")?.value||"").toLowerCase();
  const rows=INGS.filter(r=>r.nombre.toLowerCase().includes(q));
  const fld=(lbl,inner)=>`<label class="sub" style="display:flex;flex-direction:column;gap:2px">${lbl}${inner}</label>`;
  $("#inglist").innerHTML = rows.map(r=>{const id=INGS.indexOf(r);return `
    <div class="card" style="padding:10px 14px">
      <div class="row">
        <div style="min-width:0"><strong>${esc(r.nombre)}</strong><div class="nb">${nutriBadges(r)}</div></div>
        <button class="del" onclick="borraIng(${id})">✕</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px">
        ${fld("Categoría",`<select id="ic_${id}">${CATS.map(c=>`<option ${c===r.categoria?'selected':''}>${esc(c)}</option>`).join("")}</select>`)}
        ${fld("Unidad",`<input id="iu_${id}" value="${esc(r.unidad||'')}" style="width:80px">`)}
        ${fld("kcal/ud",`<input type="number" id="ik_${id}" value="${r.kcal??''}" style="width:70px">`)}
        ${fld("Histamina",`<select id="ih_${id}">${HISTS.map(h=>`<option ${h===(r.histamina||'baja')?'selected':''}>${h}</option>`).join("")}</select>`)}
        ${fld("&nbsp;",`<label style="display:flex;align-items:center;gap:5px;padding-bottom:6px"><input type="checkbox" id="il_${id}" ${Number(r.lactosa)?'checked':''} style="width:auto"> lactosa</label>`)}
        ${fld("Alérgenos (coma)",`<input id="ia_${id}" value="${esc(r.alergenos||'')}" style="width:150px">`)}
        ${fld("Mercados",`<input id="im_${id}" value="${esc(r.mercados||'')}" style="width:150px">`)}
        <button class="btn sm" onclick="guardaIng(${id})">✓ guardar</button>
      </div>
    </div>`}).join("") || '<div class="empty">Sin resultados.</div>';
}
async function guardaIng(id){
  const r=INGS[id];
  const d={nombre:r.nombre,categoria:$("#ic_"+id).value,unidad:$("#iu_"+id).value.trim(),
           mercados:$("#im_"+id).value.trim(),precio:r.precio,
           kcal:$("#ik_"+id).value,lactosa:$("#il_"+id).checked?1:0,
           histamina:$("#ih_"+id).value,alergenos:$("#ia_"+id).value.trim()};
  await post("/ingrediente/guardar",d);
  Object.assign(r,d); flash("Guardado: "+r.nombre); filtraIng();
}
async function borraIng(id){ const r=INGS[id]; if(confirm("¿Borrar '"+r.nombre+"' del maestro e inventario?")){ await post("/ingrediente/borrar",{nombre:r.nombre}); flash("Borrado"); await loadRefs(); filtraIng(); } }
async function nuevoIngrediente(){
  const nombre=prompt("Nombre del nuevo ingrediente:"); if(!nombre) return;
  await post("/ingrediente/guardar",{nombre:nombre.trim(),categoria:"Otros",unidad:"",mercados:""});
  await loadRefs(); flash("Ingrediente añadido"); listaIngredientes();
}

// ---------------- init ----------------
if("serviceWorker" in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(refreshing)return; refreshing=true; location.reload(); });
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}));
}
initDB().then(loadRefs).then(render).catch(e=>{
  view.innerHTML='<div class="empty">Error cargando datos: '+esc(e&&e.message||e)+'</div>';
});
</script>
</body>
</html>
